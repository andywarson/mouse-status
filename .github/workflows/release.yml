name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The tag must match VERSION.'
          }
      - name: Test
        shell: pwsh
        run: .\Build.ps1 -Test
      - name: Build and package
        shell: pwsh
        run: .\Package.ps1
      - name: Create draft with verified tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          $asset = "dist/MaicongMouseStatus-$version-windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME $asset "$asset.sha256" --repo $env:GITHUB_REPOSITORY --draft --verify-tag --title $env:GITHUB_REF_NAME --notes-from-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
